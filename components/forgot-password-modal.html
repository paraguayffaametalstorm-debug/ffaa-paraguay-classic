<div id="forgotPasswordModal" class="modal">
  <div class="modal-content" style="max-width:440px;">
    <div class="modal-header">
      <h3>🔑 Recuperar Contraseña</h3>
      <span class="close-btn" onclick="closeModal('forgotPasswordModal')">&times;</span>
    </div>
    <div class="modal-body">
      <p style="font-size:0.9rem;color:#cbd5e0;margin-bottom:14px;">
        Ingresa tu correo registrado en el Escuadrón para recibir instrucciones de restablecimiento.
      </p>
      <div class="form-group">
        <label for="forgotEmail">Correo Electrónico</label>
        <input type="email" id="forgotEmail" placeholder="piloto@ffaa.com" required />
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal('forgotPasswordModal')" class="btn-secondary">Cancelar</button>
      <button onclick="handleForgotPassword()" class="btn-primary" id="btnForgotSubmit">Enviar Solicitud</button>
    </div>
  </div>
</div>
