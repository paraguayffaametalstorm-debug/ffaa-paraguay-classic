<div id="forgotPasswordModal" class="modal">
  <div class="modal-content" style="max-width:440px;border-top:3px solid var(--gold-rank);">
    <div class="modal-header">
      <h3 style="margin:0;font-family:var(--font-tactical);letter-spacing:1px;color:var(--white-tactical);">🔑 RECUPERACIÓN DE CONTRASEÑA</h3>
      <span class="close-btn" onclick="closeModal('forgotPasswordModal')">&times;</span>
    </div>
    <div class="modal-body">
      <div id="forgotAlert" style="display:none;padding:10px 14px;border-radius:4px;font-size:0.85rem;margin-bottom:12px;line-height:1.4;"></div>

      <p style="font-size:0.85rem;color:var(--steel-gray);margin-bottom:14px;line-height:1.5;">
        Ingresa el correo institucional registrado en el escuadrón. Si tu cuenta existe, recibirás un enlace cifrado de restablecimiento con vigencia de <strong>15 minutos</strong>.
      </p>

      <div class="form-group" style="margin-bottom:12px;">
        <label for="forgotEmail" style="display:block;font-size:0.75rem;color:var(--steel-gray);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Correo Electrónico Registrado</label>
        <input type="email" id="forgotEmail" placeholder="piloto@ffaa.com" required 
               onkeypress="if(event.key==='Enter') handleForgotPassword()"
               style="width:100%;background:rgba(17,24,39,0.9);border:1px solid var(--border-tactical);color:#fff;padding:0.75rem 0.85rem;border-radius:4px;font-family:var(--font-mono);font-size:0.9rem;box-sizing:border-box;" />
      </div>
    </div>
    <div class="modal-footer" style="display:flex;justify-content:flex-end;gap:10px;">
      <button onclick="closeModal('forgotPasswordModal')" class="btn-secondary" style="padding:0.65rem 1.2rem;font-size:0.85rem;">Cancelar</button>
      <button onclick="handleForgotPassword()" class="btn-primary" id="btnForgotSubmit" style="padding:0.65rem 1.4rem;font-size:0.85rem;display:inline-flex;align-items:center;gap:8px;">
        <span id="btnForgotText">Enviar Enlace</span>
        <span id="btnForgotSpinner" class="spinner" style="display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></span>
      </button>
    </div>
  </div>
</div>
