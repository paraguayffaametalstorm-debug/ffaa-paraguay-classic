<header id="header">
  <div class="header-container">
    <div class="logo-section">
      <img src="/logo-escuadron.png" alt="Escuadrón PARAGUAY-FFAA" class="logo" />
      <h1>PARAGUAY-FFAA</h1>
    </div>
    
    <div class="title-section">
      <h2>SISTEMA DE GESTIÓN Y RENDIMIENTO</h2>
      <p>METALSTORM · ESCUADRÓN [PRY]</p>
    </div>

    <div class="nav-section">
      <div class="online-users" style="display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,0.3);padding:4px 10px;border-radius:20px;font-size:0.8rem;border:1px solid rgba(255,255,255,0.1);">
        <span style="display:inline-block;width:8px;height:8px;background:#2ecc71;border-radius:50%;"></span>
        <span>Pilotos: <strong id="onlineCount" style="color:#d4af37;">1</strong></span>
      </div>

      <div id="userHeaderInfo" style="display:flex;align-items:center;gap:8px;margin-left:8px;">
        <span id="userName" style="font-weight:700;font-size:0.9rem;color:#ffffff;"></span>
        <span id="userRole"></span>
      </div>

      <button id="loginBtn" onclick="showLoginModal()" class="btn-primary" style="display:none;padding:6px 12px;font-size:0.85rem;">
        🔑 Iniciar Sesión
      </button>
      <button id="logoutBtn" onclick="logout()" class="btn-danger" style="display:none;padding:6px 12px;font-size:0.85rem;">
        🚪 Salir
      </button>
      <button id="helpBtn" class="btn-secondary" style="padding:6px 12px;font-size:0.85rem;">
        ❓ Ayuda
      </button>
    </div>
  </div>

  <nav class="nav-menu" style="display:flex;gap:4px;overflow-x:auto;padding:6px 12px;background:rgba(13,27,42,0.95);border-top:1px solid rgba(212,175,55,0.2);">
    <button onclick="showView('appView')" class="active">📊 Dashboard</button>
    <button onclick="showView('performanceForm')">📝 Cargar Rendimiento</button>
    <button onclick="showView('planesView')">✈️ Hangar Aeronaves</button>
    <button onclick="showView('historialView')">📜 Mi Historial</button>
    <button onclick="showView('normativasView')">📚 Normativas</button>
    <button onclick="showView('profileView')">👤 Mi Perfil</button>
    <button onclick="showView('settingsView')">⚙️ Configuración</button>
    <button onclick="showView('helpView')">ℹ️ Guía & FAQ</button>
    
    <!-- Admin & Owner Controls -->
    <button id="adminBtn" onclick="showView('adminPanel')" style="display:none;border-color:rgba(232,67,147,0.5);">🛡️ Panel Admin</button>
    <button id="allPerformancesBtn" onclick="showView('allPerformancesView')" style="display:none;">📈 Rendimientos Globales</button>
    <button id="ownerBtn" onclick="showView('ownerPanelView')" style="display:none;border-color:rgba(212,175,55,0.6);color:#d4af37;">👑 Centro de Control</button>
    <button id="exportBtn" onclick="showView('exportView')" style="display:none;">🖼️ Reporte PNG</button>
  </nav>
</header>
