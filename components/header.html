<header id="header" class="tactical-header">
  <div class="header-container">
    <div class="logo-section" onclick="showView('appView')" style="cursor:pointer;" title="Volver al Cuadro de Mando">
      <img src="/logo-escuadron.png" alt="Escuadrón PARAGUAY-FFAA" class="logo" />
      <div class="logo-text">
        <h1 class="escuadron-title">PARAGUAY-FFAA</h1>
        <span class="escuadron-subtitle">[PRY] · METALSTORM</span>
      </div>
    </div>
    
    <div class="title-section">
      <h2>SISTEMA DE GESTIÓN Y RENDIMIENTO MILITAR</h2>
      <p>CENTRO DE MANDO TÁCTICO · ESCUADRÓN OFICIAL</p>
    </div>

    <div class="nav-section">
      <!-- Live Online Indicator -->
      <div class="online-indicator-badge" title="Pilotos activos en la plataforma">
        <span class="online-pulse-dot"></span>
        <span>Pilotos: <strong id="onlineCount">1</strong></span>
      </div>

      <!-- Quick Sync / Refresh Button -->
      <button onclick="refreshCurrentView()" class="btn-icon-tactical" title="Sincronizar Datos" aria-label="Actualizar">
        🔄
      </button>

      <!-- User Identification Pill -->
      <div id="userHeaderInfo" class="user-header-pill">
        <span id="userName" class="user-callsign"></span>
        <span id="userRole" class="user-role-container"></span>
      </div>

      <button id="loginBtn" onclick="showLoginModal()" class="btn-primary btn-sm" style="display:none;">
        🔑 Iniciar Sesión
      </button>
      <button id="logoutBtn" onclick="logout()" class="btn-danger btn-sm" style="display:none;">
        🚪 Salir
      </button>
      <button id="helpBtn" class="btn-secondary btn-sm" title="Ayuda y Soporte">
        ❓ Ayuda
      </button>
    </div>
  </div>

  <!-- Desktop Navigation Strip -->
  <nav class="nav-menu" aria-label="Menú Principal">
    <button onclick="showView('appView')" class="nav-tab active">
      <span>📊</span> Dashboard
    </button>
    <button onclick="showView('performanceForm')" class="nav-tab">
      <span>📝</span> Cargar Rendimiento
    </button>
    <button onclick="showView('planesView')" class="nav-tab">
      <span>✈️</span> Hangar Aeronaves
    </button>
    <button onclick="showView('historialView')" class="nav-tab">
      <span>📜</span> Mi Historial
    </button>
    <button onclick="showView('normativasView')" class="nav-tab">
      <span>📚</span> Normativas
    </button>
    <button onclick="showView('profileView')" class="nav-tab">
      <span>👤</span> Mi Perfil
    </button>
    <button onclick="showView('settingsView')" class="nav-tab">
      <span>⚙️</span> Configuración
    </button>
    <button onclick="showView('helpView')" class="nav-tab">
      <span>ℹ️</span> Guía & FAQ
    </button>
    
    <!-- Administrative Tabs -->
    <button id="adminBtn" onclick="showView('adminPanel')" class="nav-tab nav-tab-admin" style="display:none;">
      <span>🛡️</span> Panel Admin
    </button>
    <button id="allPerformancesBtn" onclick="showView('allPerformancesView')" class="nav-tab nav-tab-admin" style="display:none;">
      <span>📈</span> Rendimientos Globales
    </button>
    <button id="ownerBtn" onclick="showView('ownerPanelView')" class="nav-tab nav-tab-owner" style="display:none;">
      <span>👑</span> Centro de Control
    </button>
    <button id="exportBtn" onclick="showView('exportView')" class="nav-tab" style="display:none;">
      <span>🖼️</span> Reporte PNG
    </button>
  </nav>
</header>
