<div id="normativasView" class="view" style="display:none;">
  <div class="view-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
    <div>
      <h2>📚 Biblioteca de Normativas & Reglamentos</h2>
      <p class="subtitle">Directivas oficiales, protocolos de vuelo y código disciplinario</p>
    </div>
    <button onclick="showUploadNormativaModal()" class="btn-primary" id="btnUploadNormativa" style="display:inline-block;">
      📤 Subir Documento Oficial
    </button>
  </div>

  <!-- Filters Card -->
  <div class="card" style="margin-bottom:1.5rem;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end;">
      <div>
        <label for="normativasSearch" style="font-size:0.8rem;color:#a0aec0;">Buscar Directiva</label>
        <input type="text" id="normativasSearch" placeholder="Título, código o palabra..." oninput="applyNormativasFilters()" />
      </div>

      <div>
        <label for="categoriaFilter" style="font-size:0.8rem;color:#a0aec0;">Categoría</label>
        <select id="categoriaFilter" onchange="applyNormativasFilters()">
          <option value="">Todas</option>
          <option value="FUNDAMENTAL">🏛️ Fundamental</option>
          <option value="OPERACIONAL">⚙️ Operacional</option>
          <option value="DISCIPLINARIA">⚖️ Disciplinaria</option>
          <option value="ADMINISTRATIVA">📋 Administrativa</option>
          <option value="TECNICA">🔧 Técnica</option>
        </select>
      </div>

      <div>
        <label for="tipoDocFilter" style="font-size:0.8rem;color:#a0aec0;">Tipo de Documento</label>
        <select id="tipoDocFilter" onchange="applyNormativasFilters()">
          <option value="">Todos</option>
          <option value="NORMATIVA_GENERAL">Normativa General</option>
          <option value="REGLAMENTO_INTERNO">Reglamento Interno</option>
          <option value="MANUAL_PROCEDIMIENTOS">Manual de Procedimientos</option>
          <option value="PROTOCOLO_OPERACIONAL">Protocolo Operacional</option>
          <option value="CIRCULAR_INFORMATIVA">Circular Informativa</option>
          <option value="RESOLUCION_ADMINISTRATIVA">Resolución Administrativa</option>
        </select>
      </div>

      <div>
        <label for="ordenFilter" style="font-size:0.8rem;color:#a0aec0;">Ordenar Por</label>
        <select id="ordenFilter" onchange="applyNormativasFilters()">
          <option value="recientes">Más recientes</option>
          <option value="antiguos">Más antiguos</option>
          <option value="alfabetico">Alfabético</option>
        </select>
      </div>

      <div>
        <button onclick="resetNormativasFilters()" class="btn-secondary" style="width:100%;">🔄 Limpiar</button>
      </div>
    </div>
  </div>

  <div id="normativasCount" style="margin-bottom:1rem;font-size:0.9rem;color:#cbd5e0;"></div>

  <div id="normativasList" style="display:flex;flex-direction:column;gap:1rem;">
    <div class="loading-text">Cargando normativas...</div>
  </div>
</div>

<!-- Modal Subir Normativa -->
<div id="uploadNormativaModal" class="modal">
  <div class="modal-content" style="max-width:600px;">
    <div class="modal-header">
      <h3>📤 Subir Normativa o Reglamento</h3>
      <span class="close-btn" onclick="closeModal('uploadNormativaModal')">&times;</span>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="normativaTitle">Título del Documento <span style="color:#e74c3c;">*</span></label>
        <input type="text" id="normativaTitle" placeholder="Ej: Protocolo de Formación Táctica" required />
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group">
          <label for="normativaCode">Código <span style="color:#e74c3c;">*</span></label>
          <input type="text" id="normativaCode" placeholder="Ej: NOR-2026-001" required />
        </div>
        <div class="form-group">
          <label for="normativaConfidentiality">Confidencialidad</label>
          <select id="normativaConfidentiality">
            <option value="PUBLICO">Público</option>
            <option value="INTERNO">Interno</option>
            <option value="CONFIDENCIAL">Confidencial</option>
          </select>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group">
          <label for="normativaType">Tipo <span style="color:#e74c3c;">*</span></label>
          <select id="normativaType">
            <option value="NORMATIVA_GENERAL">Normativa General</option>
            <option value="REGLAMENTO_INTERNO">Reglamento Interno</option>
            <option value="MANUAL_PROCEDIMIENTOS">Manual de Procedimientos</option>
            <option value="PROTOCOLO_OPERACIONAL">Protocolo Operacional</option>
            <option value="CIRCULAR_INFORMATIVA">Circular Informativa</option>
            <option value="RESOLUCION_ADMINISTRATIVA">Resolución Administrativa</option>
          </select>
        </div>
        <div class="form-group">
          <label for="normativaCategory">Categoría <span style="color:#e74c3c;">*</span></label>
          <select id="normativaCategory">
            <option value="FUNDAMENTAL">Fundamental</option>
            <option value="OPERACIONAL">Operacional</option>
            <option value="DISCIPLINARIA">Disciplinaria</option>
            <option value="ADMINISTRATIVA">Administrativa</option>
            <option value="TECNICA">Técnica</option>
          </select>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group">
          <label for="normativaScope">Ámbito <span style="color:#e74c3c;">*</span></label>
          <input type="text" id="normativaScope" placeholder="TODO_EL_ESCUADRON" value="TODO_EL_ESCUADRON" required />
        </div>
        <div class="form-group">
          <label for="normativaApprovedDate">Fecha Aprobación <span style="color:#e74c3c;">*</span></label>
          <input type="date" id="normativaApprovedDate" required />
        </div>
      </div>

      <div class="form-group">
        <label for="normativaEffectiveDate">Fecha Entrada en Vigor <span style="color:#e74c3c;">*</span></label>
        <input type="date" id="normativaEffectiveDate" required />
      </div>

      <div class="form-group">
        <label for="normativaSummary">Resumen / Descripción <span style="color:#e74c3c;">*</span></label>
        <textarea id="normativaSummary" rows="3" placeholder="Descripción breve del contenido y alcance..." required></textarea>
      </div>

      <div class="form-group">
        <label for="normativaFile">Archivo Adjunto (PDF/DOC) <span style="color:#e74c3c;">*</span></label>
        <input type="file" id="normativaFile" accept=".pdf,.doc,.docx" required />
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal('uploadNormativaModal')" class="btn-secondary">Cancelar</button>
      <button onclick="uploadNormativa()" class="btn-primary">📤 Subir y Publicar</button>
    </div>
  </div>
</div>
