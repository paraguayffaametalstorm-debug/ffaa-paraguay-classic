<div id="profileView" class="view" style="display:none;">
  <div class="view-header" style="margin-bottom:1.5rem;">
    <h2>👤 Expediente de Piloto & Perfil</h2>
    <p class="subtitle">Datos de identificación militar y preferencias personales</p>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.5rem;">
    <div class="card">
      <div class="card-header">
        <h3>🎖️ Credenciales de Escuadrón</h3>
      </div>
      <div id="profileContent" style="margin-top:1rem;">
        <div class="loading-text">Cargando credenciales...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>📝 Información de Contacto</h3>
      </div>
      <form id="personalProfileForm" style="margin-top:1rem;">
        <div class="form-group">
          <label for="fullName">Nombre Completo</label>
          <input type="text" id="fullName" placeholder="Nombre y Apellido" />
        </div>

        <div class="form-group">
          <label for="personalEmail">Correo Personal / Respaldo</label>
          <input type="email" id="personalEmail" placeholder="contacto@ejemplo.com" />
        </div>

        <div class="form-group">
          <label for="phone">Teléfono / WhatsApp</label>
          <input type="tel" id="phone" placeholder="+595 9..." />
        </div>

        <div class="form-group" style="margin-top:1rem;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="notificationsEnabled" style="width:18px;height:18px;" />
            <span>Recibir alertas y recordatorios de eventos</span>
          </label>
        </div>

        <button type="submit" class="btn-primary" style="margin-top:1rem;width:100%;">
          💾 Guardar Datos Personales
        </button>
      </form>
    </div>
  </div>
</div>
