  <!-- ✅ Component Loader - Carga dinámica de componentes HTML -->
  <script>
    // ── Lista de componentes dinámicos (slice(5) en adelante se cargan como vistas) ──
    const COMPONENTS = [
      'header', 'footer', 'help-modal', 'session-warning',
      'forgot-password-modal',
      // Vistas principales
      'dashboard', 'performance-form', 'planes-view', 'historial-view',
      'profile-view', 'normativas-view', 'admin-panel', 'all-performances',
      'settings-view',
      'help-view',
      'owner-panel',
      'performance-export'   // ✅ v3.1 — Exportación de reportes PNG (CRÍTICO: debe existir /components/performance-export.html)
    ];

    Promise.all([
      // Header y footer (siempre cargados)
      fetch('/components/header.html').then(r => r.text()).catch(() => ''),
      fetch('/components/footer.html').then(r => r.text()).catch(() => ''),

      // Modales fijos
      Promise.all([
        fetch('/components/help-modal.html').then(r => r.text()).catch(() => ''),
        fetch('/components/session-warning.html').then(r => r.text()).catch(() => ''),
        fetch('/components/forgot-password-modal.html').then(r => r.text()).catch(() => ''),
        fetch('/components/aircraft-stats-modal.html').then(r => r.text()).catch(() => '')
      ]).then(([h, s, f, a]) => h + s + f + a),

      // Vistas dinámicas (índice 5 en adelante) - INCLUYE performance-export
      Promise.all(
        COMPONENTS.slice(5).map(view =>
          fetch(`/components/${view}.html`)
            .then(r => {
              if (!r.ok) throw new Error(`404: /components/${view}.html`);
              return r.text();
            })
            .catch(err => {
              console.error(`❌ Error cargando vista: ${view}`, err);
              return `<div id="${view.replace('-view','').replace('-panel','').replace('-form','')}View" class="view" style="display:none;"><p style="color:#dc3545;text-align:center;padding:2rem;">⚠️ Error cargando vista: ${view}</p></div>`;
            })
        )
      ).then(views => views.join('\n'))

    ]).then(([header, footer, modals, views]) => {
      document.getElementById('headerContainer').innerHTML  = header;
      document.getElementById('footerContainer').innerHTML  = footer;
      document.getElementById('modalsContainer').innerHTML  = modals;
      document.getElementById('viewsContainer').innerHTML   = views;

      console.log('✅ Componentes cargados correctamente');
      console.log('📦 Vistas disponibles:', COMPONENTS.slice(5).join(', '));

      if (typeof initApp === 'function') {
        console.log('🚀 Ejecutando initApp()...');
        initApp();
      } else {
        console.warn('⚠️ initApp() no disponible aún - esperando scripts');
        setTimeout(() => {
          if (typeof checkAuthStatus === 'function') checkAuthStatus();
        }, 500);
      }
    }).catch(err => {
      console.error('❌ Error crítico cargando componentes:', err);
      // Fallback: mostrar mensaje amigable
      const container = document.getElementById('viewsContainer');
      if (container) {
        container.innerHTML = `
          <div style="text-align:center;padding:3rem;color:#fff;">
            <h2 style="color:#dc3545;">⚠️ Error de carga</h2>
            <p>No se pudieron cargar los componentes de la interfaz.</p>
            <button onclick="location.reload()" class="btn-primary" style="margin-top:1rem;">🔄 Recargar página</button>
          </div>
        `;
      }
    });
  </script>

  <!-- ✅ Service Worker — PWA + auto-actualización -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('[SW] Registrado:', reg.scope);

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateToast();
              }
            });
          });
        }).catch(err => console.error('[SW] Error al registrar:', err));

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (window._swUpdating) window.location.reload();
        });
      });
    }

    function showUpdateToast() {
      const show = () => {
        const container = document.getElementById('toastContainer');
        if (!container) { setTimeout(show, 500); return; }
        const toast = document.createElement('div');
        toast.className = 'toast info';
        toast.style.cssText = 'display:flex;align-items:center;gap:10px;min-width:280px;';
        toast.innerHTML = `
          <span>🔄 Nueva versión disponible</span>
          <button onclick="applyUpdate()" style="
            background:var(--accent,#4a90e2);border:none;color:#fff;
            padding:4px 12px;border-radius:6px;cursor:pointer;font-size:0.85rem;
            margin-left:auto;white-space:nowrap;">
            Actualizar
          </button>`;
        container.appendChild(toast);
      };
      show();
    }

    function applyUpdate() {
      window._swUpdating = true;
      navigator.serviceWorker.ready.then(reg => {
        if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
        else window.location.reload();
      });
    }
  </script>
